name: Wonder Brands
description: 'Wonder Brands is a Latin American digital-first e-commerce company that builds and operates
  a portfolio of 15+ consumer product brands (including AlebriPets, Tropical Heal, Somos Reyes, Kingsman,
  KingsHouse, and KingsPort) spanning mattresses and bedroom furniture, sports equipment, home appliances,
  travel gear, tools, home and garden furniture, pet and baby products, and personal care. Operating an
  online-first omnichannel model across Uruguay, Mexico, Colombia, and Chile, it fulfills over 2 million
  annual orders from 25,000+ square meters of warehouse space, backed by proprietary technology for product
  optimization, marketing, pricing, and demand forecasting. Backed by QED Investors. The company exposes
  no public developer API, documentation, or SDKs at this time.'
